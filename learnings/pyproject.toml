[project]
name = "learnings"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Himanshu Parashar", email = "parasharhimanshu41@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.7",
    "langchain>=1.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.6",
